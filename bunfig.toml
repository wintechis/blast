# Bun reads bunfig.toml from the current working directory only - it does not walk up to
# the workspace root. `bun run --filter` executes each workspace script with that package
# as the cwd, so a [test] or [run] section here would silently not apply to them. Keep
# this file to settings that matter for the root-level `bun install`.
[install]
# Bun 1.3 defaults to the "isolated" linker for workspaces, where a package can only
# resolve dependencies it declares itself. react-scripts/CRA assumes a flat node_modules,
# and several transitive resolutions here (webpack's node polyfills, the babel presets
# react-scripts pulls in) depend on that layout. "hoisted" matches the Yarn
# `nodeLinker: node-modules` layout this repo migrated from.
linker = "hoisted"
